<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .lbl  { font-size: 13px; fill: #1f2328; }
    .sub  { font-size: 11px; fill: #656d76; }
    .ttl  { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .lnk  { stroke: #1f2328; stroke-width: 7; stroke-linecap: round; fill: none; }
    .jt   { fill: #ffffff; stroke: #1f2328; stroke-width: 2.5; }
    .pit  { fill: #ff8c42; stroke: #1f2328; stroke-width: 2.5; }
    .grp  { fill: #4a9d5f; stroke: #1f2328; stroke-width: 2.5; }
    .idn  { font-size: 12px; font-weight: 700; fill: #1f2328; text-anchor: middle; }
    .dim  { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 3; }
    .arc  { stroke: #ff8c42; stroke-width: 1.8; fill: none; }
  </style>

  <text x="24" y="30" class="ttl">리더암 관절 배치 · 서보 ID · 참조 자세</text>
  <text x="24" y="50" class="sub">J1=0  J2=0  J3=0  J4=-90°  J5=0  J6=+90°  J7=0   — 옆에서 보면 ㄱ자</text>

  <line x1="120" y1="358" x2="600" y2="358" class="dim"/>
  <text x="606" y="362" class="sub">테이블</text>

  <!-- base -->
  <rect x="150" y="330" width="70" height="26" rx="4" fill="#eaeef2" stroke="#1f2328" stroke-width="2"/>
  <text x="185" y="348" class="idn">BASE</text>

  <!-- J1 yaw -->
  <circle cx="185" cy="320" r="13" class="jt"/>
  <text x="185" y="325" class="idn">1</text>
  <text x="120" y="303" class="lbl" text-anchor="end">J1 yaw</text>
  <line x1="128" y1="299" x2="168" y2="315" class="dim"/>
  <path d="M 168 300 A 22 10 0 1 1 202 300" class="arc"/>

  <!-- upper arm: J1 -> J2 -->
  <line x1="185" y1="320" x2="185" y2="250" class="lnk"/>

  <!-- J2 pitch -->
  <circle cx="185" cy="235" r="13" class="pit"/>
  <text x="185" y="240" class="idn">2</text>
  <text x="120" y="228" class="lbl" text-anchor="end">J2 pitch</text>
  <text x="120" y="244" class="sub" text-anchor="end">중력 부하 최대</text>
  <line x1="128" y1="232" x2="170" y2="234" class="dim"/>

  <line x1="185" y1="235" x2="185" y2="175" class="lnk"/>

  <!-- J3 roll -->
  <circle cx="185" cy="160" r="13" class="jt"/>
  <text x="185" y="165" class="idn">3</text>
  <text x="120" y="156" class="lbl" text-anchor="end">J3 roll</text>
  <line x1="128" y1="158" x2="170" y2="159" class="dim"/>

  <line x1="185" y1="160" x2="185" y2="120" class="lnk"/>

  <!-- J4 pitch elbow -->
  <circle cx="185" cy="105" r="13" class="pit"/>
  <text x="185" y="110" class="idn">4</text>
  <text x="185" y="78" class="lbl" text-anchor="middle">J4 pitch · 팔꿈치</text>
  <text x="185" y="62" class="sub" text-anchor="middle">리밋 [-3.077, -0.117] · 항상 음수</text>
  <path d="M 205 90 A 28 28 0 0 1 224 118" class="arc"/>

  <!-- forearm: J4 -> J5 (horizontal forward) -->
  <line x1="185" y1="105" x2="300" y2="105" class="lnk"/>

  <!-- J5 roll -->
  <circle cx="315" cy="105" r="13" class="jt"/>
  <text x="315" y="110" class="idn">5</text>
  <text x="315" y="78" class="lbl" text-anchor="middle">J5 roll</text>

  <line x1="315" y1="105" x2="400" y2="105" class="lnk"/>

  <!-- J6 pitch wrist -->
  <circle cx="415" cy="105" r="13" class="pit"/>
  <text x="415" y="110" class="idn">6</text>
  <text x="415" y="78" class="lbl" text-anchor="middle">J6 pitch · 손목</text>
  <text x="415" y="62" class="sub" text-anchor="middle">리밋 [+0.440, +4.622] · 항상 양수</text>
  <path d="M 433 92 A 26 26 0 0 1 442 120" class="arc"/>

  <!-- down to J7 -->
  <line x1="415" y1="105" x2="415" y2="175" class="lnk"/>

  <!-- J7 roll -->
  <circle cx="415" cy="190" r="13" class="jt"/>
  <text x="415" y="195" class="idn">7</text>
  <text x="452" y="194" class="lbl">J7 roll</text>

  <line x1="415" y1="190" x2="415" y2="222" class="lnk"/>

  <!-- gripper trigger -->
  <rect x="392" cy="0" y="222" width="46" height="24" rx="4" class="grp"/>
  <text x="415" y="239" class="idn">8</text>
  <text x="452" y="239" class="lbl">그리퍼 트리거</text>
  <text x="452" y="254" class="sub">스트로크 약 95°</text>

  <!-- legend -->
  <g transform="translate(560,150)">
    <text x="0" y="0" class="ttl">범례</text>
    <circle cx="12" cy="22" r="11" class="jt"/>
    <text x="32" y="26" class="lbl">roll / yaw</text>
    <circle cx="12" cy="52" r="11" class="pit"/>
    <text x="32" y="56" class="lbl">pitch — 처짐 발생</text>
    <rect x="1" y="72" width="22" height="18" rx="3" class="grp"/>
    <text x="32" y="86" class="lbl">그리퍼</text>
    <text x="0" y="120" class="sub">서보 8개 전부 STS3215</text>
    <text x="0" y="136" class="sub">C044 (1:191)</text>
    <text x="0" y="152" class="sub">ID는 베이스→그리퍼 순</text>
  </g>
</svg>
